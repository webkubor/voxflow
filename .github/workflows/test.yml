name: Test

# 门禁只跑**不需要模型、不需要凭据**的那部分：计量算钱的逻辑和前端类型。
# 完整的端到端（scripts/smoke.py）要起服务、要 8.4 GB 模型、要上游凭据，
# 那是本机跑的事。
#
# ⚠️ 但「只跑轻量的」不等于「不装任何依赖」—— 这条曾经把徽章弄红了一百次
#    运行而没人发现（因为它从第一次起就没绿过，于是所有人都当它是装饰）。
#    见下方「装被测模块的最小依赖」那一步的说明。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: 计量逻辑自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 被测逻辑本身确实只用标准库（sqlite3 / json / pathlib），但
      # tests/test_obs.py 里有一个用例要 `from web.app import economics` ——
      # 它测的是 /api/economics 的聚合口径，而那段的实现就在 FastAPI 模块里。
      # 不装这两个，那个用例必然 ModuleNotFoundError。
      #
      # 只装这两个、**仍然不装 requirements**：torch / mlx / onnxruntime 要几分钟，
      # 且与被测逻辑毫无关系。实测这两个装完，test_obs 18 条 + test_cover 29 条全过。
      - name: 装被测模块的最小依赖
        run: pip install fastapi python-multipart
      - name: 跑计量自检
        run: python tests/test_obs.py
      # 封面的纯逻辑（比例校验 + 出图后的画幅核对）。不碰网络、不花积分。
      - name: 跑封面逻辑自检
        run: python tests/test_cover.py

  frontend:
    name: 前端类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - run: npm ci
        working-directory: web/ui
      # typecheck + build。ky 2.x 那次 hook 签名不兼容之所以能溜进生产，
      # 正是因为调用点用 `as unknown as` 把类型关掉了 —— 类型检查是这类
      # 「升级后运行时全挂、编译期一声不吭」问题唯一的防线。
      - run: npm run check
        working-directory: web/ui
