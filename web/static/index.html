<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/branding/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoxFlow 声流 — AI 声音 · AI 音乐 · 自动发布</title>
    <!-- 全局错误捕获，用于 E2E 测试取证 -->
    <script>
      window.__errors = [];
      window.onerror = function(msg, url, line, col, error) {
        window.__errors.push({ 
          type: 'error',
          msg: msg, 
          url: url, 
          line: line, 
          col: col, 
          stack: error ? error.stack : '' 
        });
      };
      window.addEventListener('unhandledrejection', function(event) {
        window.__errors.push({ 
          type: 'promise_rejection',
          msg: 'Unhandled rejection: ' + event.reason, 
          stack: event.reason ? event.reason.stack : '' 
        });
      });
      console.error = (function(oldError) {
        return function() {
          const args = Array.from(arguments).map(x => {
            if (x instanceof Error) return x.message + '\n' + x.stack;
            if (typeof x === 'object' && x !== null) {
              try {
                // 如果是普通对象，转为 string，但如果是 Error-like 或者是 Vue 警告，尝试解构
                if (x.message || x.stack) {
                  return (x.message || '') + '\n' + (x.stack || '');
                }
                return JSON.stringify(x);
              } catch(e) {
                return String(x);
              }
            }
            return String(x);
          });
          window.__errors.push({ 
            type: 'console_error',
            msg: args.join(' ') 
          });
          oldError.apply(console, arguments);
        };
      })(console.error);
    </script>

    <link rel="stylesheet" crossorigin href="/static/assets/index-C-3xTLqW.css">
  </head>

    <div id="app"></div>
  </body>
</html>
